name: generate-snake-game-from-github-contribution-gridname: generate-snake-game-from-github-contribution-grid

on:
  schedule:
    # runs once a day, at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main              # regenerate whenever you push to main

jobs:
  generate:
    permissions:
      contents: write     # needed to push to the "output" branch
    runs-on: ubuntu-latest
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: shivam7-gif
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}